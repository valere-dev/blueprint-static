<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Edenvia ads</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet"><style>:root{--bg:#0F0C0A;--line:#3A322B;--acc:#E0662C;--card:#1A1613}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:16px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:24px 16px 80px}h1{font:700 42px/1.05 Oswald,sans-serif;text-transform:uppercase;margin:18px 0 6px}

details{margin-top:12px;background:#000;border:1px solid var(--line);border-radius:10px;padding:10px 14px}summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;font:13px/1.5 ui-monospace,Menlo,monospace;margin:10px 0 0}
